<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог кулинара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
    (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }
    })();
</script>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <svg width="1em" height="1em" viewBox="0 2 16 16">
                    <use xlink:href="images/sprite.svg#apple"></use>
                </svg>
                Рецепты</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="search.html">Поиск</a></li>
                    <li class="nav-item"><a class="nav-link" href="authors.html">Кулинары</a></li>
                </ul>
                <div class="d-flex" id="authButtons"></div>
                <div class="d-flex ms-2" id="themeToggle">
                    <button class="btn btn-sm btn-outline-secondary" id="themeSwitcher" aria-label="Переключить тему">🌙</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h1 class="visually-hidden">Блог кулинара</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <img src="images\avatars\default.jpg" alt="authorAvatar" class="rounded-circle mb-3" width="120" height="120" id="bloggerAvatar">
                        <h2 class="h3" id="bloggerName">Имя блогера</h2>
                        <p id="bloggerBio">Описаниe</p>
                        <p>Подписчиков: <span id="bloggerFollowers">0</span></p>
                        <button class="btn btn-primary" id="subscribeBtn">Подписаться</button>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <h3 class="h4">Рецепты блогера</h3>
                <div class="row" id="bloggerRecipes"></div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p>© 2025 Кулинарный портал</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <!-- <script src="js/recipes-data.js"></script> -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
