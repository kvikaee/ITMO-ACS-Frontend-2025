<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепт</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
    (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }
    })();
</script>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <svg width="1em" height="1em" viewBox="0 2 16 16">
                    <use xlink:href="images/sprite.svg#apple"></use>
                </svg>
                Рецепты</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="search.html">Поиск</a></li>
                    <li class="nav-item"><a class="nav-link" href="authors.html">Кулинары</a></li>
                </ul>
                <div class="d-flex" id="authButtons"></div>
                <div class="d-flex ms-2" id="themeToggle">
                    <button class="btn btn-sm btn-outline-secondary" id="themeSwitcher" aria-label="Переключить тему">🌙</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row">
            <div class="col-md-8">
                <h1 id="recipeTitle">Название рецепта</h1>
                <p id="recipeDescription" class="lead"></p>
                <img src="images/recipes/placeholder.jpg" class="img-fluid rounded" alt="recipe" id="recipeImage">
                
                <div class="d-flex justify-content-between align-items-center my-3">
                    <div>
                        <span class="badge bg-secondary" id="recipeType">Тип</span>
                        <span class="badge bg-secondary" id="recipeDifficulty">Сложность</span>
                    </div>
                    <button class="btn btn-outline-danger" id="likeBtn" aria-label="Поставить лайк">
                        <i class="bi bi-heart"></i> <span id="likeCount">0</span>
                    </button>
                </div>

                <h2 class="h4">Ингредиенты</h2>
                <ul id="ingredientsList"></ul>

                <h2 class="h4">Пошаговые инструкции</h2>
                <ol id="stepsList"></ol>

                <h2 class="h4">Видео</h2>
                <div id="videoContainer" class="mb-4">
                    <!-- подгужается через массив -->
                </div>

                <hr>

                <!-- Комментарии -->
                <h2 class="h4">Комментарии</h2>
                <div id="commentsSection">
                    <div id="commentsList"></div>
                    <form id="commentForm" class="mt-3">
                        <div class="mb-3">
                            <label for="commentText" class="form-label">Ваш комментарий</label>
                            <textarea class="form-control" id="commentText" rows="2" placeholder="Напишите что-нибудь..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Отправить</button>
                    </form>
                </div>
            </div>
            <div class="col-md-4 mt-3 mt-md-0">
                <div class="card">
                    <div class="card-body">
                        <h3 class="h5">Автор рецепта</h3>
                        <div class="d-flex align-items-center">
                            <img src="images/avatars/default.jpg" alt="avatar" width="50" height="50" class="rounded-circle me-2" id="authorAvatar">
                            <div>
                                <a href="blog.html?authorId=1" id="authorName">Имя автора</a>
                                <br>
                                <small>Подписчиков: <span id="followersCount">0</span></small>
                            </div>
                        </div>
                        <button class="btn btn-outline-primary mt-2 w-100" id="followBtn">Подписаться</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p>© 2025 Кулинарный портал</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <!-- <script src="js/recipes-data.js"></script> -->
    <script src="js/auth.js"></script>
    <script src="js/recipe.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
