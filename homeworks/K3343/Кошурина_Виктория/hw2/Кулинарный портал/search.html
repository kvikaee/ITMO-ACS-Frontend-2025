<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск рецептов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">🍏 Рецепты</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="search.html">Поиск</a></li>
                    <li class="nav-item"><a class="nav-link" href="authors.html">Кулинары</a></li>
                </ul>
                <div class="d-flex" id="authButtons"></div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h1 class="h2">Поиск рецептов</h1>
        <div class="row">
            <div class="col-md-3">
                <!-- Фильтры -->
                <div class="card">
                    <div class="card-body">
                        <h2 class="h5">
                        <div class="mb-3">
                            <label for="searchByName" class="form-label">Название рецепта</label>
                            <input type="text" class="form-control" id="searchByName" placeholder="Введите название...">
                        </div>
                        </h2>
                        <hr>
                        <h2 class="h5">Фильтры</h2>
                        <h3 class = "h6">Тип блюда</h3>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="typeSoup" value="суп">
                            <label class="form-check-label" for="typeSoup">Суп</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="typeMain" value="основное">
                            <label class="form-check-label" for="typeMain">Основное блюдо</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="typeDessert" value="десерт">
                            <label class="form-check-label" for="typeDessert">Десерт</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="typeSalad" value="салат">
                            <label class="form-check-label" for="typeSalad">Салат</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="typeAppetizer" value="закуска">
                            <label class="form-check-label" for="typeAppetizer">Закуска</label>
                        </div>

                        <h3 class = "h6 mt-3">Сложность</h3>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="difficulty" id="diffAny" value="" checked>
                            <label class="form-check-label" for="diffAny">Любая</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="difficulty" id="diffEasy" value="легко">
                            <label class="form-check-label" for="diffEasy">Легко</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="difficulty" id="diffMedium" value="средне">
                            <label class="form-check-label" for="diffMedium">Средне</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="difficulty" id="diffHard" value="сложно">
                            <label class="form-check-label" for="diffHard">Сложно</label>
                        </div>

                        
                        <label for="ingredientInput" class="mt-3 h6">Ингредиент</label>
                        <div class="mb-2">
                            <input type="text" class="form-control" id="ingredientInput" placeholder="Например, картофель">
                            <button class="btn btn-sm btn-outline-secondary mt-1" id="addIngredientBtn">Добавить</button>
                        </div>
                        <div id="ingredientsList" class="mb-2"></div>

                        <button class="btn btn-primary w-100 mt-3" id="applyFilters">Применить</button>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="row" id="searchResults">
                    <!-- результаты поиска (будут загружены через js) -->
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p>© 2025 Кулинарный портал</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/search.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
